<title>Lab Ledger Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a clean, white lab tool in Adaptyv's visual language. Three views:
   scenario tests as a timeline feed, simulations as pictures of what happened,
   and the scenario catalog. */
:root {
  --paper: #fafbfd;
  --sheet: #ffffff;
  --ink: #142933;
  --muted: #546874;
  --faint: #8396a1;
  --line: #e1e8ed;
  --accent: #2091c9;
  --accent-soft: #e9f2f7;
  /* chart categories, validated (hands, pen, questions, scanner) */
  --c1: #2091c9; --c2: #d4702a; --c3: #7a5cd6; --c4: #1a9a85; --c0: #b3c1ca;
  /* status */
  --ok: #1e7a50; --ok-soft: #e4f3ea;
  --warn: #8a5d00; --warn-mark: #d49a1c; --warn-soft: #fbf1d9;
  --bad: #b3402a; --bad-soft: #f8e6e1;
  --rule: #5b4fc4; --rule-soft: #eeecfb;
  --display: "Geist", "Helvetica Neue", Arial, sans-serif;
  --body: "Geist", "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1c24; --sheet: #142933; --ink: #eaf1f5; --muted: #93a8b4; --faint: #6d8592; --line: #25414f;
    --accent: #36b7f6; --accent-soft: #183a4b;
    --c1: #2e98d6; --c2: #cc7a3a; --c3: #8c78de; --c4: #2fa98f; --c0: #3d5867;
    --ok: #5fcf96; --ok-soft: #173a2b; --warn: #e6b65c; --warn-mark: #c9952a; --warn-soft: #3a2d12;
    --bad: #f08c76; --bad-soft: #3e231d; --rule: #aaa1f5; --rule-soft: #2a2752; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1c24; --sheet: #142933; --ink: #eaf1f5; --muted: #93a8b4; --faint: #6d8592; --line: #25414f;
  --accent: #36b7f6; --accent-soft: #183a4b;
  --c1: #2e98d6; --c2: #cc7a3a; --c3: #8c78de; --c4: #2fa98f; --c0: #3d5867;
  --ok: #5fcf96; --ok-soft: #173a2b; --warn: #e6b65c; --warn-mark: #c9952a; --warn-soft: #3a2d12;
  --bad: #f08c76; --bad-soft: #3e231d; --rule: #aaa1f5; --rule-soft: #2a2752; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--line); }
header .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding-block: 12px; }
h1, h2, h3 { font-family: var(--display); font-weight: 500; margin: 0; text-wrap: balance; }
h1 { font-size: 21px; letter-spacing: -0.04em; }
h2 { font-size: 28px; line-height: 1.15; letter-spacing: -0.04em; }
h3 { font-size: 17px; letter-spacing: -0.02em; }
.brand { display: grid; }
.by { font-size: 12.5px; color: var(--muted); }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { font: 500 14px var(--body); color: var(--muted); background: none; border: 1px solid transparent; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
nav button[aria-current="true"] { color: var(--sheet); background: var(--ink); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tally { margin-left: auto; font: 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
main { padding-block: 24px 80px; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 0.92em; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 12px var(--mono); padding: 2px 9px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.ok { color: var(--ok); background: var(--ok-soft); }
.pill.bad { color: var(--bad); background: var(--bad-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 12px var(--mono); padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); cursor: pointer; }
.chip.static { cursor: default; color: var(--muted); }
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 0; }
.stack { display: grid; gap: 20px; min-width: 0; }

/* Tests view */
.split { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 900px) { .split { grid-template-columns: minmax(0, 1fr); } }
.list { display: grid; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); max-height: calc(100vh - 96px); overflow: auto; }
@media (max-width: 900px) { .list { position: static; max-height: 300px; } }
.item { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left; font: inherit; color: inherit; background: none; border: 1px solid transparent; border-radius: 10px; padding: 7px 10px; cursor: pointer; }
.item:hover { background: var(--sheet); }
.item[aria-current="true"] { background: var(--sheet); border-color: var(--line); }
.item .n { font: 12px var(--mono); color: var(--faint); }
.item .t { font-weight: 500; font-size: 14px; }
.ring { width: 14px; height: 14px; border-radius: 50%; }
.thead { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: end; justify-content: space-between; }
.score { display: flex; align-items: center; gap: 14px; }
.score svg { flex: none; }
.score .big { font: 500 28px var(--display); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.story { background: var(--accent-soft); border-radius: 12px; padding: 16px 18px; white-space: pre-line; max-width: 80ch; margin: 0; }
.blockgrid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
@media (max-width: 1100px) { .blockgrid { grid-template-columns: minmax(0, 1fr); } }

.feed { position: relative; display: grid; gap: 0; }
.day { display: grid; grid-template-columns: 64px 36px minmax(0, 1fr); align-items: center; padding: 14px 0 6px; }
.day span { grid-column: 3; font: 500 13px var(--body); color: var(--muted); }
.ev { display: grid; grid-template-columns: 64px 36px minmax(0, 1fr); gap: 0; position: relative; }
.ev .time { font: 12px var(--mono); color: var(--faint); text-align: right; padding: 12px 10px 0 0; font-variant-numeric: tabular-nums; }
.ev .rail { position: relative; display: flex; justify-content: center; }
.ev .rail::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: var(--line); }
.av { position: relative; z-index: 1; margin-top: 8px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 600 11px var(--body); color: #fff; }
.av.robot { border-radius: 7px; }
.av.rule { border-radius: 7px; transform: rotate(45deg) scale(0.86); }
.av.rule span { transform: rotate(-45deg); }
.card { margin: 4px 0 8px 6px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--sheet); display: grid; gap: 6px; min-width: 0; }
.card.voided { background: transparent; border-style: dashed; }
.card.voided .say { text-decoration: line-through; text-decoration-color: var(--bad); color: var(--muted); }
.card.correction { background: var(--warn-soft); border-color: transparent; }
.card.byrule { background: var(--rule-soft); border-color: transparent; }
.say { font-size: 14.5px; overflow-wrap: anywhere; }
.say b { font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.tag { font: 11.5px var(--mono); padding: 1px 8px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.rule { background: var(--rule); border-color: var(--rule); color: var(--sheet); }
.tag.late { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.tag.robot_log { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.lines { display: flex; flex-wrap: wrap; gap: 6px; }
.ln { font: 12.5px var(--mono); padding: 3px 9px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.ln .neg { color: var(--bad); } .ln .pos { color: var(--ok); }
.note { font-size: 13px; color: var(--muted); }
.more { font: 12.5px var(--body); color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; justify-self: start; }

.checks { display: grid; gap: 6px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); }
.ck { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; font-size: 13.5px; padding: 8px 10px; border-radius: 10px; background: var(--sheet); border: 1px solid var(--line); }
.ck.no { background: var(--bad-soft); border-color: transparent; }
.ck .mk { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font: 700 11px var(--body); color: var(--sheet); background: var(--ok); margin-top: 1px; }
.ck.no .mk { background: var(--bad); }
.ck .val { font: 12px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
pre.sql { margin: 10px 0 0; padding: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; font: 12px/1.55 var(--mono); }

/* Simulation view */
.runbar { display: flex; flex-wrap: wrap; gap: 20px; align-items: start; margin-bottom: 22px; }
.runbar .grp { display: grid; gap: 6px; }
.runbar .grp > span { font-size: 13px; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { font: 500 13px var(--body); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.how { display: grid; gap: 14px; }
.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 10px; }
.node { flex: 1 1 170px; min-width: 0; border-radius: 12px; padding: 12px 14px; background: var(--accent-soft); display: grid; gap: 4px; align-content: start; }
.node.dark { background: var(--ink); color: var(--sheet); }
.node.dark .muted { color: var(--c0); }
.node b { font-weight: 600; }
.node p { margin: 0; font-size: 13px; }
.arrow { flex: 0 0 18px; align-self: center; height: 2px; background: var(--faint); position: relative; }
.arrow::after { content: ""; position: absolute; right: -1px; top: -4px; border: 5px solid transparent; border-left: 7px solid var(--faint); border-right: 0; }
@media (max-width: 700px) { .arrow { display: none; } }
.lede { font-size: 17px; line-height: 1.55; max-width: 78ch; margin: 0; }
.lede b { font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 12px; }
.stat { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; }
.stat .v { font: 500 26px var(--display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 13px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.scroller { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--sheet); }
svg text { font-family: var(--body); }
.tip { position: fixed; z-index: 30; pointer-events: none; max-width: 340px; background: var(--ink); color: var(--sheet); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; line-height: 1.4; box-shadow: 0 8px 24px rgb(0 0 0 / 0.18); }
.tip b { font-weight: 600; }
.detail { display: grid; gap: 8px; }
.detail .res { font: 12.5px/1.5 var(--mono); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 900px) { .two { grid-template-columns: minmax(0, 1fr); } }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.sc { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.sc:hover, .sc[aria-pressed="true"] { border-color: var(--accent); }
.sc p { margin: 0; font-size: 13.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.status { font: 11.5px var(--mono); padding: 1px 8px; border-radius: 999px; }
.status.new { background: var(--accent); color: var(--sheet); }
.status.variant { background: var(--accent-soft); color: var(--accent); }
.status.covered { background: var(--paper); color: var(--muted); border: 1px solid var(--line); }
.md { font-size: 14px; max-width: 82ch; }
.md h4 { font: 600 14.5px var(--body); margin: 14px 0 4px; }
.md p, .md ul { margin: 6px 0; }
.md ul { padding-left: 18px; }
.fatebar { display: flex; height: 26px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--sheet); }
.fatebar div { min-width: 2px; }
.ftable { display: grid; gap: 8px; }
.frow { display: grid; grid-template-columns: 170px minmax(0, 1fr) 48px; gap: 12px; align-items: center; font-size: 13.5px; }
.frow .bar { display: flex; height: 14px; gap: 2px; }
.frow .bar div { border-radius: 2px; min-width: 2px; }
.frow .n { font: 12.5px var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 600px) { .frow { grid-template-columns: 110px minmax(0, 1fr) 36px; } }
.mlog { display: grid; gap: 6px; }
.mrow { display: grid; grid-template-columns: 130px 120px minmax(0, 1fr); gap: 12px; padding: 8px 12px; border-radius: 10px; background: var(--sheet); border: 1px solid var(--line); font-size: 13.5px; align-items: baseline; }
@media (max-width: 700px) { .mrow { grid-template-columns: minmax(0, 1fr); gap: 2px; } }
.fate { font: 11.5px var(--mono); padding: 1px 8px; border-radius: 999px; justify-self: start; }
table.cmp { border-collapse: collapse; font-size: 13.5px; width: 100%; }
table.cmp th, table.cmp td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
table.cmp th:first-child, table.cmp td:first-child { text-align: left; }
table.cmp th { font-weight: 500; color: var(--muted); }

/* Scenario catalog */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
.filters input[type=search], .filters select { font: inherit; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--sheet); color: var(--ink); min-width: 0; }
.filters input[type=search] { flex: 1 1 260px; }
.filters label { font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.count { font: 13px var(--mono); color: var(--muted); }
.card2 p { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 0.35); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--sheet); z-index: 21; overflow-y: auto; padding: calc(24px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)) 24px; display: grid; gap: 16px; align-content: start; border-left: 1px solid var(--line); }
.drawer .close { justify-self: end; font: inherit; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; color: var(--ink); cursor: pointer; }
.drawer section p { margin: 0; white-space: pre-line; }
.drawer ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.sublabel { font: 500 13px var(--body); color: var(--muted); margin: 0 0 8px; }
@media (prefers-reduced-motion: no-preference) { .item, .sc, nav button, .seg button { transition: background-color .15s, border-color .15s; } }
</style>

<header>
  <div class="wrap">
    <div class="brand"><h1>Lab Ledger Review</h1><span class="by">Take-home by Batuhan Aktas for Adaptyv Bio</span></div>
    <nav aria-label="Views">
      <button id="nav-tests" data-view="tests">Scenario tests</button>
      <button id="nav-sim" data-view="sim">Simulations</button>
      <button id="nav-scenarios" data-view="scenarios">Scenario catalog</button>
    </nav>
    <span class="tally" id="tally">Loading…</span>
  </div>
</header>

<main class="wrap">
  <section id="view-tests" class="split" aria-label="Scenario tests">
    <div class="list" id="test-list" role="list"></div>
    <div class="stack" id="test-detail"><p class="muted">Loading the test traces…</p></div>
  </section>
  <section id="view-sim" hidden aria-label="Simulations"><div class="stack" id="sim-body"></div></section>
  <section id="view-scenarios" hidden aria-label="Scenario catalog">
    <div class="filters">
      <input type="search" id="sc-q" placeholder="Search stories, noise, ids" aria-label="Search scenarios">
      <select id="sc-cluster" aria-label="Theme"><option value="">All themes</option></select>
      <label><input type="checkbox" id="sc-short"> Shortlisted only</label>
      <label><input type="checkbox" id="sc-tested"> Covered by a test</label>
      <span class="count" id="sc-count"></span>
    </div>
    <div class="cards" id="sc-cards"></div>
  </section>
</main>
<div id="drawer-root"></div>
<div class="tip" id="tip" hidden></div>

<script>
const UNIT = { volume: "µL", mass: "µg", count: "pcs", activity: "U" };
const state = { tests: [], scenarios: [], sim: [], byId: {}, tested: new Set(), view: "tests", test: 0, run: null, sel: null, hl: null, fateFilter: null };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => { const n = Number(v); if (!isFinite(n)) return String(v); return Number.isInteger(n) ? n.toLocaleString("en-GB") : (+n.toFixed(1)).toLocaleString("en-GB"); };
const mat = m => !m ? "" : m.startsWith("target:") ? m.slice(7).toUpperCase() : m.replace(/^[a-z_]+:/, "").replace(/-/g, " ");
const nice = s => { const t = s.replace(/\bqc\b/gi, "QC").replace(/\bsim\b/gi, "simulation"); return t.charAt(0).toUpperCase() + t.slice(1); };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const dayOf = iso => iso.slice(0, 10);
const hm = iso => iso.slice(11, 16);
const dayName = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });
const tip = document.getElementById("tip");
function showTip(e, html) { tip.innerHTML = html; tip.hidden = false; moveTip(e); }
function moveTip(e) { const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8); const y = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8); tip.style.left = x + "px"; tip.style.top = y + "px"; }
function hideTip() { tip.hidden = true; }

/* ---------- actors ---------- */
const PEOPLE = { "p:lena": "Lena", "p:marco": "Marco", "p:sara": "Sara" };
const PERSON_COLOR = ["#2091c9", "#1a9a85", "#7a5cd6", "#d4702a", "#546874"];
function actor(id) {
  if (!id) return { name: "someone", cls: "", init: "?", color: "#8396a1" };
  if (id.startsWith("rule:")) return { name: "the protocol rule", cls: "rule", init: "R", color: css("--rule") };
  if (id.startsWith("robot:")) return { name: id.slice(6).replace(/-/g, " "), cls: "robot", init: "⚙", color: "#546874" };
  if (id.startsWith("instrument:")) return { name: id.slice(11).replace(/-/g, " "), cls: "robot", init: "◎", color: "#546874" };
  if (id.startsWith("system:")) return { name: "an import", cls: "robot", init: "⇣", color: "#8396a1" };
  const name = PEOPLE[id] || id.replace(/^p:/, "").replace(/^./, c => c.toUpperCase());
  const i = Object.keys(PEOPLE).indexOf(id);
  return { name, cls: "", init: name[0], color: PERSON_COLOR[(i >= 0 ? i : name.charCodeAt(0)) % PERSON_COLOR.length] };
}

/* ---------- tests: sentences ---------- */
function amt(l) { const n = Math.abs(Number(l.amount)); return `${num(n)} ${UNIT[l.dimension] || l.dimension}`; }
function sentence(e) {
  const who = actor(e.performed_by || e.by).name;
  const L = e.lines, of = t => L.filter(l => l.type === t);

function lineChip(l) {

function lag(a, b) {

function swimlanes(r) {

  const people = r.people;
  const DAYW = 440, LAB = 150, LANE = 42, TOP = 34, H = TOP + people.length * LANE + 16;
  const W = LAB + days.length * DAYW + 12;
  const mins = s => { const h = +s.slice(11, 13), m = +s.slice(14, 16); return Math.max(0, Math.min(630, (h - 8) * 60 + m)); };
  const x = s => LAB + days.indexOf(dayOf(s)) * DAYW + (mins(s) / 630) * (DAYW - 10);
  const hl = state.hl ? new Set(state.hl) : null;
  let g = "";
  days.forEach((d, i) => {
    const x0 = LAB + i * DAYW;
    g += `<rect x="${x0}" y="${TOP - 6}" width="${DAYW - 10}" height="${people.length * LANE + 8}" rx="8" fill="${css("--paper")}"/>`;
    g += `<text x="${x0}" y="16" font-size="12" font-weight="500" fill="${css("--ink")}">${dayName(d)}</text>`;
    for (const hr of [10, 12, 14, 16, 18]) { const xx = x0 + ((hr - 8) * 60 / 630) * (DAYW - 10); g += `<line x1="${xx}" x2="${xx}" y1="${TOP - 6}" y2="${TOP + people.length * LANE + 2}" stroke="${css("--line")}"/><text x="${xx}" y="${H - 2}" font-size="10" text-anchor="middle" fill="${css("--faint")}">${hr}:00</text>`; }
  });
  people.forEach((p, i) => {
    const y = TOP + i * LANE;
    g += `<text x="0" y="${y + 14}" font-size="12.5" font-weight="500" fill="${css("--ink")}">${esc(p.name)}</text><text x="0" y="${y + 27}" font-size="10.5" fill="${css("--muted")}">${esc(p.role)}</text>`;
  });
  for (const c of r.calls) {
    const i = people.findIndex(p => p.id === c.who); if (i < 0) continue;
    const y = TOP + i * LANE + 8, x0 = x(c.start), w = Math.max(3, x(c.end) - x0);
    const dim = hl && !hl.has(c.n) ? 0.18 : 1, sel = state.sel === c.n;
    g += `<rect class="mark" data-n="${c.n}" x="${x0}" y="${y}" width="${w}" height="24" rx="3" fill="${KCOLOR(c.kind)}" opacity="${dim}" ${sel ? `stroke="${css("--ink")}" stroke-width="2"` : ""}/>`;
    if (c.refused) g += `<path d="M${x0 + w / 2 - 4} ${y - 5} l8 0 l-4 6 z" fill="${css("--bad")}" opacity="${dim}"/>`;
    if (hl && hl.has(c.n)) g += `<circle cx="${x0 + w / 2}" cy="${y + 30}" r="3" fill="${css("--ink")}"/>`;

function lineChart(points, series, title, unit) {
  const W = 560, H = 220, L = 56, R = 120, T = 16, B = 30;
  const vals = series.flatMap(s => points.map(p => p[s.key])).filter(v => v != null);
  const max = Math.max(...vals) * 1.08 || 1, min = 0;
  const x = i => L + (points.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (points.length - 1));
  const y = v => T + (H - T - B) * (1 - (v - min) / (max - min));
  let g = "";
  for (let k = 0; k <= 4; k++) { const v = min + (max - min) * k / 4; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${css("--line")}"/><text x="${L - 8}" y="${y(v) + 4}" font-size="10.5" text-anchor="end" fill="${css("--faint")}">${num(Math.round(v))}</text>`; }
  points.forEach((p, i) => { if (points.length <= 10 || i % Math.ceil(points.length / 8) === 0) g += `<text x="${x(i)}" y="${H - 8}" font-size="10.5" text-anchor="middle" fill="${css("--faint")}">${esc(p.label)}</text>`; });
  series.forEach(s => {
    const d = points.map((p, i) => `${i ? "L" : "M"}${x(i)} ${y(p[s.key])}`).join(" ");
    g += `<path d="${d}" fill="none" stroke="${css(s.color)}" stroke-width="2" ${s.dash ? 'stroke-dasharray="5 4"' : ""}/>`;
    points.forEach((p, i) => { g += `<circle class="pt" cx="${x(i)}" cy="${y(p[s.key])}" r="4" fill="${css(s.color)}" stroke="${css("--sheet")}" stroke-width="2" data-tip="${esc(`<b>${p.label}</b><br>${s.name}: ${num(p[s.key])} ${unit}`)}"/>`; });
    const last = points[points.length - 1];
    g += `<text x="${x(points.length - 1) + 10}" y="${y(last[s.key]) + 4 + (s.nudge || 0)}" font-size="11.5" fill="${css("--ink")}">${s.name}</text>`;
  });
  return `<div class="panel"><h3 class="sublabel" style="color:var(--ink)">${title}</h3><svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${g}</svg></div>`;
}
function barsChart(points, key, title, color) {
  const W = 560, H = 160, L = 40, T = 12, B = 28;
  const max = Math.max(1, ...points.map(p => p[key])) * 1.15;
  const bw = Math.min(36, (W - L - 10) / points.length - 6);
  let g = "";
  points.forEach((p, i) => {
    const x = L + i * ((W - L - 10) / points.length) + 3, h = (H - T - B) * p[key] / max, y = H - B - h;
    g += `<rect class="pt" x="${x}" y="${y}" width="${bw}" height="${Math.max(h, 1)}" rx="3" fill="${css(color)}" data-tip="${esc(`<b>${p.label}</b><br>${title}: ${num(p[key])}`)}"/>`;
    if (points.length <= 10 || i % Math.ceil(points.length / 8) === 0) g += `<text x="${x + bw / 2}" y="${H - 9}" font-size="10.5" text-anchor="middle" fill="${css("--faint")}">${esc(p.label)}</text>`;
  });
  g += `<line x1="${L}" x2="${W - 10}" y1="${H - B}" y2="${H - B}" stroke="${css("--line")}"/>`;
  return `<div class="panel"><h3 class="sublabel" style="color:var(--ink)">${title}</h3><svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${g}</svg></div>`;
}
function fateBar(counts, total, tall) {
  return `<div class="${tall ? "fatebar" : "bar"}">${FATES.filter(f => counts[f[0]]).map(f => `<div class="pt" style="flex:${counts[f[0]]};background:${css(f[2])}" data-tip="${esc(`<b>${f[1]}</b>: ${counts[f[0]]} of ${total}`)}"></div>`).join("")}</div>`;
}
function renderDice(r) {
  const t = r.totals, total = r.mistakes_total, cp = r.checkpoints, last = cp[cp.length - 1] || {};
  const silent = t["silently wrong"] || 0, flagged = t["flagged"] || 0, healed = t["no lasting harm"] || 0, fixed = (t["corrected"] || 0) + (t["refused at entry"] || 0);
  const siblings = state.sim.filter(x => x.kind === "dice" && x.preset === r.preset && x.days === r.days && x.designs_per_week === r.designs_per_week);
  const types = Object.entries(r.fates).map(([k, v]) => [k, v, Object.values(v).reduce((a, b) => a + b, 0)]).sort((a, b) => b[2] - a[2]);
  const maxType = Math.max(1, ...types.map(x => x[2]));
  const allMs = r.mistakes.filter(m => !state.fateFilter || m.fate === state.fateFilter);
  const ms = state.showAll ? allMs : allMs.slice(0, 25);
  const tgtGap = last.target_says - last.target_really, protGap = last.protein_really ? Math.round(100 * (last.protein_says - last.protein_really) / last.protein_really) : 0;
  return `${howDice()}
    <p class="lede">${r.days} simulated days at <b>${num(r.designs_per_week)} designs a week</b>, ${r.targets} targets, ${r.preset === "bad_week" ? "with <b>bad-week</b> noise (about ten times the researched error rates)" : "with the <b>researched</b> error rates"}. ${num(r.recorded_calls)} things were written down, and <b>${num(total)} mistakes</b> were mixed in. In the end, ${num(flagged)} were flagged, ${num(fixed)} were fixed or refused straight away, ${num(healed)} did no lasting harm, and <b style="color:var(--bad)">${num(silent)} stayed silently wrong</b>. Usable target ended ${Math.abs(tgtGap) < 5 ? "within 5 µL of the truth" : `${num(Math.abs(tgtGap))} µL ${tgtGap < 0 ? "under" : "over"} the truth`}; expressed protein ${protGap >= 0 ? "over" : "under"}stated by ${Math.abs(protGap)}%.</p>
    <div class="panel stack">
      <h3>What became of every mistake</h3>
      ${fateBar(t, total, true)}
      <div class="legend">${FATES.filter(f => t[f[0]]).map(f => `<span><i style="background:${css(f[2])}"></i>${f[1]}: ${t[f[0]]}</span>`).join("")}</div>
      <div class="ftable" style="margin-top:8px">${types.map(([k, v, n]) => `<div class="frow"><span>${esc(ERRTEXT[k] || k.replaceAll("_", " "))}</span><div style="width:${100 * n / maxType}%">${fateBar(v, n, false)}</div><span class="n">${n}</span></div>`).join("")}</div>
    </div>
    ${cp.length ? `<div class="two">
      ${lineChart(cp, [{ key: "target_says", name: "Inventory says", color: "--c1" }, { key: "target_really", name: "Really there", color: "--c2", dash: true, nudge: 12 }], "Usable target protein over time", "µL")}
      ${lineChart(cp, [{ key: "protein_says", name: "Inventory says", color: "--c1" }, { key: "protein_really", name: "Really there", color: "--c2", dash: true, nudge: 12 }], "Usable expressed protein over time", "µL")}
      ${barsChart(cp, "ghosts", "Ghost containers (binned, still on record)", "--bad")}
      ${barsChart(cp, "flags", "Open flags for a person to look at", "--warn-mark")}
    </div>` : ""}
    ${siblings.length > 1 ? `<div class="panel stack"><h3>Same lab, different random seeds</h3><p class="muted" style="margin:0">If the design only worked by luck, these would disagree.</p><div style="overflow-x:auto"><table class="cmp"><tr><th>Seed</th><th>Mistakes</th><th>Flagged</th><th>No lasting harm</th><th>Silently wrong</th><th>Target gap at the end</th></tr>${siblings.map(x => { const l = x.checkpoints[x.checkpoints.length - 1] || {}; return `<tr><td>${x.seed ?? "?"}</td><td>${x.mistakes_total}</td><td>${x.totals["flagged"] || 0}</td><td>${x.totals["no lasting harm"] || 0}</td><td>${x.totals["silently wrong"] || 0}</td><td>${num((l.target_says || 0) - (l.target_really || 0))} µL</td></tr>`; }).join("")}</table></div></div>` : ""}
    <div class="stack"><div><h3>The mistakes, one by one</h3><p class="muted" style="margin:4px 0 0">The worst first. Filter by what became of them.</p></div>
      <div class="seg">${[["", "All"], ...FATES.filter(f => t[f[0]]).map(f => [f[0], f[1]])].map(([k, l]) => `<button data-fate="${k}" aria-pressed="${(state.fateFilter || "") === k}">${l}</button>`).join("")}</div>
      <div class="mlog">${ms.map(m => `<div class="mrow"><span class="fate" style="background:${FCOLOR(m.fate)};color:#fff">${esc(m.fate)}</span><span class="muted">${esc(ERRTEXT[m.type] || m.type)}</span><span>${esc(m.what)} <span class="muted mono">${esc(actor(m.by).name)}, ${esc(m.at.slice(5, 16).replace("T", " "))}</span></span></div>`).join("")}</div>
      ${allMs.length > ms.length ? `<button class="more" data-showall="1">Show all ${allMs.length}</button>` : ""}
    </div>`;
}
function renderSim() {
  const el = document.getElementById("sim-body");
  if (!state.sim.length) { el.innerHTML = `<div class="panel"><h2>No simulation runs yet</h2></div>`; return; }
  const r = state.sim.find(x => x.name === state.run) || state.sim[0];
  state.run = r.name;
  el.innerHTML = runPicker() + (r.kind === "agents" ? renderAgents(r) : renderDice(r));
}

/* ---------- scenarios ---------- */
function scenarioCard(s) {
  return `<button class="sc card2" data-sc="${esc(s.id)}">
    <div class="chips"><span class="tag">${esc(s.id)}</span>${s.depth === "core" ? `<span class="status variant">core</span>` : `<span class="tag">${esc(s.depth)}</span>`}${state.tested.has(s.id) ? `<span class="status new">tested</span>` : ""}</div>
    <h3>${esc(s.title)}</h3><p>${esc(s.story)}</p>
    <div class="chips"><span class="tag">${esc((s.cluster || "").replaceAll("_", " "))}</span><span class="tag">${esc(s.frequency)}</span><span class="tag">cost if wrong: ${esc(s.cost_if_wrong)}</span></div>
  </button>`;
}
function renderScenarios() {
  const q = document.getElementById("sc-q").value.trim().toLowerCase(), cl = document.getElementById("sc-cluster").value;
  const short = document.getElementById("sc-short").checked, tested = document.getElementById("sc-tested").checked;
  const rows = state.scenarios.filter(s => (!cl || s.cluster === cl) && (!short || s.shortlisted) && (!tested || state.tested.has(s.id)) &&
    (!q || JSON.stringify([s.id, s.title, s.story, s.real_life_noise, s.system_should]).toLowerCase().includes(q)));
  document.getElementById("sc-count").textContent = `${rows.length} of ${state.scenarios.length}`;
  document.getElementById("sc-cards").innerHTML = rows.map(scenarioCard).join("") || `<p class="muted">Nothing matches. Try a shorter search or another theme.</p>`;
}
function openScenario(id) {
  const s = state.byId[id]; if (!s) return;
  const tests = state.tests.filter(t => t.scenarios.includes(id));
  const list = v => Array.isArray(v) ? `<ul>${v.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p>${esc(v)}</p>`;
  document.getElementById("drawer-root").innerHTML = `<div class="scrim" id="scrim"></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-title"><button class="close" id="dr-close">Close</button>
      <div class="chips"><span class="tag">${esc(s.id)}</span><span class="tag">${esc((s.cluster || "").replaceAll("_", " "))}</span><span class="tag">${esc(s.depth)}</span></div>
      <h2 id="dr-title">${esc(s.title)}</h2>
      <section><h3 class="sublabel">Story</h3><p>${esc(s.story)}</p></section>
      <section><h3 class="sublabel">How it goes wrong in real life</h3>${list(s.real_life_noise)}</section>
      <section><h3 class="sublabel">What the system should do</h3><p>${esc(s.system_should)}</p></section>
      <section><h3 class="sublabel">Why it matters</h3><p>${esc(s.frequency)}, cost if wrong ${esc(s.cost_if_wrong)}: ${esc(s.cost_reason)}</p></section>
      ${tests.length ? `<section><h3 class="sublabel">Tested in</h3><div class="chips">${tests.map(t => `<button class="chip" data-goto="${state.tests.indexOf(t)}">${String(t.number).padStart(2, "0")} ${esc(t.name)}</button>`).join("")}</div></section>` : ""}
    </aside>`;
  document.getElementById("dr-close").focus();
}
const closeDrawer = () => { document.getElementById("drawer-root").innerHTML = ""; };

/* ---------- navigation ---------- */
function show(view) {
  state.view = view;
  for (const v of ["tests", "sim", "scenarios"]) { document.getElementById("view-" + v).hidden = v !== view; document.getElementById("nav-" + v).setAttribute("aria-current", String(v === view)); }
  try { history.replaceState(null, "", "#" + (view === "tests" ? "test-" + String(state.tests[state.test]?.number ?? 1).padStart(2, "0") : view)); } catch (e) {}
}
function selectTest(i) { state.test = i; renderList(); renderTest(); show("tests"); window.scrollTo({ top: 0 }); }
document.addEventListener("click", e => {
  const t = e.target;
  const nav = t.closest("nav button[data-view]"); if (nav) return show(nav.dataset.view);
  const item = t.closest(".item[data-i]"); if (item) return selectTest(+item.dataset.i);
  const go = t.closest("[data-goto]"); if (go) { closeDrawer(); return selectTest(+go.dataset.goto); }
  const run = t.closest("[data-run]"); if (run) { state.run = run.dataset.run; state.sel = null; state.hl = null; state.hlDisc = null; state.fateFilter = null; state.showAll = false; return renderSim(); }
  const mark = t.closest(".mark"); if (mark) { state.sel = +mark.dataset.n; return renderSim(); }
  const disc = t.closest("[data-disc]"); if (disc) { const r = state.sim.find(x => x.name === state.run); const i = +disc.dataset.disc; if (state.hlDisc === i) { state.hlDisc = null; state.hl = null; } else { state.hlDisc = i; state.hl = evidence(r.discovered[i]); } return renderSim(); }
  const fate = t.closest("[data-fate]"); if (fate) { state.fateFilter = fate.dataset.fate || null; state.showAll = false; return renderSim(); }
  const sa = t.closest("[data-showall]"); if (sa) { state.showAll = true; return renderSim(); }
  const sc = t.closest("[data-sc]"); if (sc) return openScenario(sc.dataset.sc);
  if (t.id === "scrim" || t.id === "dr-close") closeDrawer();
});
document.addEventListener("mouseover", e => {
  const m = e.target.closest(".mark");
  if (m) { const r = state.sim.find(x => x.name === state.run); const c = r && r.calls && r.calls.find(x => x.n === +m.dataset.n); if (c) showTip(e, `<b>${esc(c.who.replace(/^./, x => x.toUpperCase()))}</b>, ${hm(c.start)}: ${esc(c.tool)}${c.refused ? " (refused)" : ""}<br>${esc(c.result.slice(0, 160))}`); return; }
  const p = e.target.closest(".pt"); if (p && p.dataset.tip) { showTip(e, p.dataset.tip); return; }
  hideTip();
});
document.addEventListener("mousemove", e => { if (!tip.hidden) moveTip(e); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
for (const id of ["sc-q", "sc-cluster", "sc-short", "sc-tested"]) document.getElementById(id).addEventListener("input", renderScenarios);
async function load(name) { try { const r = await fetch(`data/${name}.json`); return r.ok ? r.json() : []; } catch (e) { return []; } }

(async () => {
  [state.tests, state.scenarios, state.sim] = await Promise.all([load("tests"), load("scenarios"), load("sim")]);
  state.tests.sort((a, b) => a.number - b.number);
  for (const s of state.scenarios) state.byId[s.id] = s;
  for (const t of state.tests) for (const id of t.scenarios) state.tested.add(id);
  const pref = state.sim.find(r => r.kind === "agents" && r.calls.length > 300) || state.sim.find(r => r.kind === "agents") || state.sim[0];
  state.run = pref && pref.name;
  document.getElementById("sc-cluster").insertAdjacentHTML("beforeend", [...new Set(state.scenarios.map(s => s.cluster).filter(Boolean))].sort().map(c => `<option value="${esc(c)}">${esc(c.replaceAll("_", " "))}</option>`).join(""));
  const checks = state.tests.reduce((n, t) => n + t.checks_total, 0);
  document.getElementById("tally").textContent = `${state.tests.filter(t => t.passed).length}/${state.tests.length} tests pass, ${checks} checks, ${state.sim.length} simulation runs`;
  const h = (location.hash || "").slice(1), m = h.match(/^test-(\d+)$/);
  if (m) { const i = state.tests.findIndex(t => t.number === +m[1]); if (i >= 0) state.test = i; }
  renderList(); renderTest(); renderScenarios(); renderSim();
  show(["sim", "scenarios"].includes(h) ? h : "tests");
})();
</script>

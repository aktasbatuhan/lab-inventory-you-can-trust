  system_should: |
    Add the new type with rows and settings, not new tables. Handle units properly: mass for powder, volume plus concentration for the stock. Let a type carry conditions like "keep dark" that can be broken and recorded like a temperature excursion.
  question_it_answers: Can the model take a new kind of material without a schema change?
  frequency: rare

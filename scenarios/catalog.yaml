- id: XFER-023
  cluster: losses_and_dead_volume
  duplicate_of: null
  noise_ref: open_384_bench
  title: Evaporation from an open plate
  story: |
    Given a 384-well plate with 20 µL per well left unsealed on the bench for 6 hours.
    When it is measured before use.
    Then wells hold 17 to 19 µL, edge wells less, and concentrations went up by the same factor.
  real_life_noise:
    - nobody measures; the system keeps showing 20 µL forever
    - the seal is put on crooked and the corner wells dry out over a weekend
  system_should: |
    Accept a recount fact per well or a plate-wide adjustment with a reason (evaporation). Don't try to predict evaporation in the database; let the simulation produce it and the recount correct it.
  question_it_answers: Why does the system show more than the plate holds?
  frequency: daily
  cost_if_wrong: low
  cost_reason: Small drift, but it adds up on source plates used many times
  depth: supported
  sim_hook: |
    Environment process: per open plate, lose 0.2 to 0.6 µL per well per hour, edge wells ×2. Scientist recount p≈0.1 per use.
  source: research

- id: XFER-024
  cluster: well_level_transfers
  duplicate_of: null
  title: 96-well and 384-well formats in the same run
  story: |
    Given four 96-well DNA plates.
    When a robot compresses them into one 384-well plate (quadrant layout, plate 1 to A1, A3..., plate 2 to A2, A4...).
    Then each 384 well maps to exactly one 96 well, and the mapping follows a known rule.
  real_life_noise:
    - the quadrant rule differs by robot software (interleaved vs block)
    - one of the four 96-well plates is only half full
  system_should: |
    Container types know their format (rows by columns). Well names must be validated against the format, so "P24" is fine on 384 and rejected on 96.
  question_it_answers: Which 96-well plate and well did 384-well B2 come from?
  frequency: weekly
  cost_if_wrong: high
  cost_reason: A wrong quadrant rule scrambles four customers at once
  depth: core
  sim_hook: |
    Actor robot, action compress_96_to_384(rule=interleaved|block). Error wrong_rule_assumed p≈0.005 per run.
  source: research

- id: XFER-025
  cluster: counted_consumables
  duplicate_of: null
  title: Tip and consumable use during a run
  story: |
    Given a robot run of 96 transfers with fresh tips.
    When the run finishes.
    Then two boxes of 96 tips (one for aspirate steps, one spare for retries) and one destination plate are used up, counted as boxes, not tips.
  real_life_noise:
    - the robot reuses tips for buffer steps, so tip count isn't a fixed number
    - partial tip boxes are put back on the shelf
  system_should: |
    Track consumables as counts per box or per plate, not per tip. Decrement on run completion. Don't link every tip to a transfer.
  question_it_answers: How many 384-well plates and tip boxes do we have left?
  frequency: many-per-day
  cost_if_wrong: low
  cost_reason: Running out stops the lab, but the fix is just ordering
  depth: supported
  sim_hook: |
    Actor robot, action run_worklist consumes ceil(n_transfers/96) tip boxes; partial_box_return p≈0.4.
  source: brief

- id: XFER-026
  cluster: losses_and_dead_volume
  duplicate_of: null
  title: Liquid stuck in tips and walls (transfer loss)
  story: |
    Given a protein sample of 50 µL pipetted into 5 wells of 10 µL.
    When the transfers are done.
    Then in practice the first four wells get 10 µL, the last gets about 7 µL, and 3 µL stays on tip walls and the tube. The source is empty.
  real_life_noise:
    - sticky protein or detergent buffers lose more
    - nobody records the loss, so the totals never balance
  system_should: |
    Accept that sum of outputs can be less than inputs. Record the gap as a loss on the run instead of forcing the numbers to balance. Never accept outputs larger than inputs without a flag.
  question_it_answers: Why don't our volumes add up?
  frequency: many-per-day
  cost_if_wrong: low
  cost_reason: Small per transfer, but it hides real errors if not modelled
  depth: supported
  sim_hook: |
    Physics: every transfer loses 1 to 5 percent; viscous material 5 to 15 percent.
  source: inferred

- id: XFER-027
  cluster: barcode_is_not_container
  duplicate_of: RCV-020
  title: Transfer between two plates of the same barcode (relabelled plate)
  story: |
    Given a plate whose barcode label fell off in the freezer and was replaced with a new label.
    When the next run scans the new barcode.
    Then the system doesn't know the plate and creates a fresh empty one, so the run looks like it took from nothing.
  real_life_noise:
    - the scientist reuses the old barcode by printing it again
    - the old barcode is put on a different plate
  system_should: |
    Allow a barcode to be reassigned to an existing container with a recorded reason, and keep old barcodes as aliases. Refuse to auto-create a container from a scan inside a transfer.
  question_it_answers: Is this the same plate as before?
  frequency: monthly
  cost_if_wrong: medium
  cost_reason: Breaks lineage silently
  depth: supported
  sim_hook: |
    Actor scientist, event label_lost p≈0.002 per plate-week in freezer; relabel_new_barcode p≈0.7, reprint_old p≈0.3.
  source: inferred

- id: XFER-028
  cluster: split_conservation
  duplicate_of: null
  noise_ref: step_not_recorded
  title: Transfer with no destination container recorded
  story: |
    Given a scientist takes 20 µL from a target tube for a quick test and doesn't use a tracked container.
    When she records "used 20 µL".
    Then the tube goes down by 20 µL and the run says "consumed, no destination".
  real_life_noise:
    - it's never recorded and the tube is 20 µL short at the next recount
  system_should: |
    Support consumption without a destination (goes into an untracked tube, an instrument, the sink). Keep the same transfer shape with an empty destination and a reason.
  question_it_answers: What happened to the missing 20 µL?
  frequency: daily
  cost_if_wrong: medium
  cost_reason: Unrecorded uses are why counts drift
  depth: core
  sim_hook: |
    Actor scientist, action ad_hoc_use. Error unrecorded p≈0.25.
  source: brief

- id: XFER-029
  cluster: double_entry
  duplicate_of: EDGE-023
  title: A transfer recorded twice
  story: |
    Given a robot log uploaded by a script and then again by hand.
    When both imports go through.
    Then each well shows twice the consumption and the destination shows double the volume.
  real_life_noise:
    - the second import has a slightly different file name
    - the robot exports the same run in two formats
  system_should: |
    Use the instrument's run id plus timestamp as a key so the same run cannot be imported twice. If it is, keep the second as a rejected duplicate, visible.
  question_it_answers: Did this run happen once or twice?
  frequency: monthly
  cost_if_wrong: high
  cost_reason: Doubles consumption of a whole plate in one click
  depth: core
  sim_hook: |
    Actor scientist, action import_log. Error duplicate_import p≈0.02 per run.
  source: research

- id: XFER-030
  cluster: corrections_and_history
  duplicate_of: null
  title: Undo a transfer that never happened
  story: |
    Given a run recorded at 10:00 but the scientist cancelled before the robot started.
    When she marks the run as cancelled at 10:30.
    Then all its transfers are reversed by new entries, and the history shows both.
  real_life_noise:
    - she deletes the run instead (the system must not allow that)
  system_should: |
    Cancellation is a new event that reverses the run, not a delete.
  question_it_answers: What did the record say before the cancellation?
  frequency: weekly
  cost_if_wrong: medium
  cost_reason: Deletes lose the audit trail
  depth: core
  sim_hook: |
    Actor scientist, action cancel_run p≈0.02 per run; try_delete p≈0.1 of those.
  source: brief

- id: XFER-031
  cluster: plate_wells
  duplicate_of: null
  noise_ref: wrong_position_selected
  title: Partial plate use across several days
  story: |
    Given a reconstituted DNA plate of 96 designs.
    When columns 1 to 4 are used on Monday, 5 to 8 on Wednesday, 9 to 12 next week.
    Then the plate is one container with very different volumes per column, and freeze-thaw is counted for the whole plate each time it comes out.
  real_life_noise:
    - wells in column 1 get used again by mistake on Wednesday
    - plate stays on the bench between uses
  system_should: |
    Track volume per well, and storage events per plate. A well's history must show every draw.
  question_it_answers: Which wells of this DNA plate still have enough to run again?
  frequency: weekly
  cost_if_wrong: medium
  cost_reason: Re-runs need DNA; a used-up well means reordering
  depth: core
  sim_hook: |
    Actor scientist, action use_columns(subset). Error wrong_columns p≈0.01.
  source: inferred

- id: XFER-032
  cluster: mixed_contents
  duplicate_of: null
  title: A tube that is both a source and a destination in one task
  story: |
    Given a target tube with 30 µL at 2 mg/mL.
    When a scientist adds 30 µL buffer to it to dilute in place.
    Then the tube has 60 µL at 1 mg/mL of the same target lot, plus the buffer lot as an ingredient.
  real_life_noise:
    - records it as a new tube
    - doesn't update concentration, only volume
  system_should: |
    Allow in-place dilution: one container, volume up, concentration down, ingredient added.
  question_it_answers: What concentration is this tube now?
  frequency: weekly
  cost_if_wrong: medium
  cost_reason: Wrong concentration feeds into target plate prep
  depth: supported
  sim_hook: |
    Actor scientist, action dilute_in_place. Error concentration_not_updated p≈0.15.
  source: inferred

# ---------------------------------------------------------------------------
# The Binding workflow, end to end, one scenario per task box in the diagram
# ---------------------------------------------------------------------------

- id: XFER-BIND-01
  cluster: plate_wells
  duplicate_of: RCV-006
  title: DNA arrival
  story: |
    Given an order for 96 DNA designs from Twist.
    When a 96-well plate arrives with dried DNA, a plate map file (well, design name, ng per well), and a supplier lot number.
    Then one plate container exists, 96 wells each holding a mass of DNA (about 500 to 1000 ng), each well its own DNA lot linked to its design. Nothing is thrown away.
  real_life_noise:
    - two wells are marked "failed" in the plate map and hold no DNA
    - the plate map has 96 rows but the plate is 384 format
    - the plate is put in the freezer before being scanned
    - assumption, Twist ships some orders as dried DNA in plates; we assume this format for Adaptyv
  system_should: |
    Import the plate map as initial contents. Failed wells are empty from the start. In: nothing. Out: one plate, up to 96 new DNA lots. Lots are new (supplier lot per design).
  question_it_answers: Which DNA did we receive, and which designs failed at the supplier?
  frequency: weekly
  cost_if_wrong: high
  cost_reason: Every later step depends on this mapping
  depth: core
  sim_hook: |
    Actor receiver, action receive_dna_plate(n=24..96). Errors: supplier_failed_well p≈0.01, plate_map_mismatch p≈0.01, late_scan p≈0.1.
  source: workflow

- id: XFER-BIND-02
  cluster: amount_kinds
  duplicate_of: XFER-014
  title: DNA reconstitution
  story: |
    Given the Twist plate from BIND-01.
    When water is added to every well (for example 40 µL).
    Then same plate, same DNA lots, now with volume and calculated concentration. Water lot is an ingredient. Nothing is thrown away.
  real_life_noise:
    - all the noise in XFER-014
    - reconstitutes the whole plate when only 24 designs are needed this week, so 72 wells sit wet in the freezer
    - plate sits on the bench 3 hours before going back, and the system has no record it was out
  system_should: |
    In: DNA plate (mass) plus water. Out: same plate (volume plus concentration). Lots carry over.
  question_it_answers: What concentration is each DNA well now?
  frequency: weekly
  cost_if_wrong: medium
  cost_reason: Concentration errors propagate into expression
  depth: core
  sim_hook: |
    Same as XFER-014.
  source: workflow

- id: XFER-BIND-03
  cluster: well_level_transfers
  duplicate_of: XFER-015
  title: DNA dilution (optional step)
  story: |
    Given the reconstituted plate.
    When a diluted copy is made because the DNA is too concentrated for expression.
    Then a new diluted DNA plate exists with the same lots per well, lower concentration. The reconstituted plate stays as the master and goes back to the freezer.
  real_life_noise:
    - the step is skipped for some plates and not others, so later steps take from either plate
  system_should: |
    In: reconstituted plate plus water. Out: new plate, lots carry over. The next step must be able to take from either plate.
  question_it_answers: Which plate did the expression plate take its DNA from?
  frequency: weekly
  cost_if_wrong: medium
  cost_reason: Wrong source plate breaks lineage
  depth: core
  sim_hook: |
    Actor robot, action dilute p≈0.5 of experiments.
  source: workflow

- id: XFER-BIND-04
  cluster: well_level_transfers
  duplicate_of: null
  title: Expression plate prep
  story: |
    Given DNA (reconstituted or diluted plate) and a cell-free expression mix (assumption, Adaptyv uses cell-free expression).
    When a robot puts mix and a small volume of DNA (for example 2 µL) into each well of a new expression plate.
    Then a new plate exists with each well holding DNA lot plus mix lot. DNA plate wells go down. Tips and the empty plate are used up.
  real_life_noise:
    - mix thawed and left at room temperature too long
    - plate map uses different well layout from the DNA plate (for example 96 to 384)
  system_should: |
    In: DNA plate, mix. Out: expression plate, still holding DNA (not protein yet). No new lots until expression runs.
  question_it_answers: Which DNA went into each well of the expression plate?
  frequency: weekly
  cost_if_wrong: high
  cost_reason: Mapping errors here give wrong customer data
  depth: core
  sim_hook: |
    Actor robot, action run_worklist(DNA to expression plate). Errors as XFER-007 to XFER-010.
  source: workflow

- id: XFER-BIND-05
  cluster: made_material
  duplicate_of: XFER-020
  title: Expression run
  story: |
    Given the expression plate from BIND-04.
    When it incubates (assumption, several hours, about 30 °C).
    Then each well contains a new protein lot, linked to its DNA lot and the mix lot. The plate gets a 2-week life from now.
  real_life_noise:
    - all the noise in XFER-020
    - expression plate goes into the fridge after the run with nobody recording the end time, so the 2-week clock starts from the plan
    - wells with no DNA (supplier failures) still get mix and are counted as "no expression"
  system_should: |
    In: expression plate with DNA. Out: same plate with protein. New lots per well.
  question_it_answers: When was this protein made, and when does it expire?
  frequency: weekly
  cost_if_wrong: high
  cost_reason: Start of sample lineage
  depth: core
  sim_hook: |
    Same as XFER-020.
  source: workflow

- id: XFER-BIND-06
  cluster: receiving_and_qc
  duplicate_of: RCV-001
  title: Antigen arrival
  story: |
    Given an order for Target X from a supplier.
    When a vial of lyophilised (freeze-dried) target arrives, for example 100 µg, with a certificate of analysis.
    Then one vial exists with a new supplier lot, mass 100 µg, waiting for QC.
  real_life_noise:
    - two vials of the same lot arrive in one box and are registered as two lots
    - the certificate says 100 µg, the vial label says 0.1 mg
  system_should: |
    In: nothing. Out: one vial, new lot, not usable until QC. See RCV area for receiving detail.
  question_it_answers: What target lots do we have waiting for QC?
  frequency: weekly
  cost_if_wrong: high
  cost_reason: Target is expensive and shared
  depth: core
  sim_hook: |
    Actor receiver, action receive_vial. Errors as RCV area.
  source: workflow

- id: XFER-BIND-07
  cluster: amount_kinds
  duplicate_of: RCV-002
  noise_ref: step_not_recorded
  title: Antigen reconstitution, buffer exchange and QC, ending in a target stock tube
  story: |
    Given the 100 µg vial of Target X.
    When it is dissolved in 100 µL water (1 mg/mL), moved into running buffer by buffer exchange (a spin column, losing about 10 to 20 percent), measured, and QC'd.
    Then there is a target stock tube with about 90 µL at about 0.9 mg/mL in the new buffer, same supplier lot, QC passed. The vial and the spin column are thrown away.
  real_life_noise:
    - the yield after buffer exchange is 70 percent, recorded as 100
    - QC fails and the stock tube still gets aliquoted
    - the stock tube format is "ABE / ART format" in the diagram; we don't know what that means (assumption, it's a named tube format or supplier label)
  system_should: |
    In: vial, water, buffer. Out: stock tube, same lot, new buffer as ingredient. Thrown away: vial, column. Losses recorded. QC result attached to the lot.
  question_it_answers: How much usable Target X do we have after QC?
  frequency: weekly
  cost_if_wrong: high
  cost_reason: Shared target; wrong amount means wrong ordering decision
  depth: core
  sim_hook: |
    Actor scientist, action reconstitute_exchange_qc. Errors: loss_unrecorded p≈0.4, qc_fail p≈0.05, use_before_qc p≈0.02.
  source: workflow

- id: XFER-BIND-08
  cluster: well_level_transfers
  duplicate_of: null
  noise_ref: [wrong_container_scanned, step_not_recorded]
  title: BLI or SPR target plate prep
  story: |
    Given the target stock tube.
    When a scientist dilutes target to, for example, 10 µg/mL in loading buffer and fills 8 wells of a 96-well black plate at 200 µL each (assumption, Octet uses about 200 µL per well in 96 format, 40 to 80 µL in 384 tilted plates).
    Then a target plate exists, 8 wells of Target X lot, and the stock tube went down by about 16 µL.
  real_life_noise:
    - the target plate also has buffer-only wells for baseline, not recorded
    - target is taken from the oldest open tube, not the one recorded
  system_should: |
    In: target stock, loading buffer. Out: target plate. Lots carry over. Target plate is thrown away after use.
  question_it_answers: How much target did this experiment use?
  frequency: weekly
  cost_if_wrong: high
  cost_reason: Target consumption drives reordering
  depth: core
  sim_hook: |
    Actor scientist, action prep_target_plate. Errors: wrong_tube p≈0.03, buffer_wells_unrecorded p≈0.3.
  source: workflow

- id: XFER-BIND-09
  cluster: well_level_transfers
  duplicate_of: null
  title: Split GFP plate prep
  story: |
    Given the expression plate with protein.
    When a robot moves a small amount (for example 5 µL) from each well into a split-GFP plate that holds the GFP1-10 detector (assumption, samples carry a short GFP11 tag; when they meet, the GFP turns on and glows in proportion to protein amount).
    Then a split-GFP plate exists, each well holding protein lot plus detector lot. The expression plate wells go down.
  real_life_noise:
    - GFP detector stock has passed its 6-month frozen life
    - plate prepared in 384 from a 96 expression plate
  system_should: |
    In: expression plate, GFP stock buffer. Out: split-GFP plate. Lots carry over. Plate thrown away after measurement.
  question_it_answers: Which protein is in each Split GFP well?
  frequency: weekly
  cost_if_wrong: medium
  cost_reason: Bad mapping gives wrong concentrations downstream
  depth: core
  sim_hook: |
    Actor robot, action run_worklist(expression to GFP plate).
  source: workflow

- id: XFER-BIND-10
  cluster: amount_kinds
  duplicate_of: null
  title: Split GFP measurement
  story: |
    Given the split-GFP plate.
    When a plate reader measures fluorescence.
    Then each protein lot on the expression plate gets a measured concentration, and the split-GFP plate is thrown away with liquid still in it.
  real_life_noise:
    - reader file has its own well numbering
    - plate thrown away before the data was checked
  system_should: |
    In: split-GFP plate. Out: measurements linked to the protein lots, not just to the plate. Thrown away: split-GFP plate with contents.
  question_it_answers: What concentration is each expressed protein?
  frequency: weekly
  cost_if_wrong: medium
  cost_reason: Feeds normalisation
  depth: supported
  sim_hook: |
    Actor plate reader, action measure. Error wrong_plate_file p≈0.01.
  source: workflow

- id: XFER-BIND-11
  cluster: well_level_transfers
  duplicate_of: XFER-018
  title: Sample concentration normalisation
  story: |
    Given Split GFP concentrations for each protein lot.
    When a worklist is computed and used during sample plate prep.
    Then each sample well gets its own buffer volume to reach a target concentration.
  real_life_noise:
    - all the noise in XFER-018
    - the diagram marks this step as "implementation in progress", so today it may be a scientist's spreadsheet, not a worklist the system sees
    - the measurement used is from before a re-expression, so it describes different protein lots
  system_should: |
    In: measurement plus expression plate. Out: worklist. No material moves in this step itself.
  question_it_answers: Which measurement did this normalisation use?
  frequency: weekly
  cost_if_wrong: high
  cost_reason: Wrong concentrations in BLI
  depth: supported
  sim_hook: |
    Same as XFER-018.
  source: workflow

- id: XFER-BIND-12
  cluster: well_level_transfers
  duplicate_of: null
  title: BLI or SPR sample plate prep
  story: |
    Given the expression plate with protein and loading buffer.
    When a robot moves protein into one or more sample plates, diluting each to target concentration.
    Then sample plates exist, wells hold protein lots plus buffer lot. The expression plate goes back to the fridge for 2 weeks in case of re-runs.
  real_life_noise:
    - more than one sample plate per expression plate
    - a re-run uses the expression plate after 2 weeks
  system_should: |
    In: expression plate, loading buffer. Out: sample plates. Lots carry over.
  question_it_answers: Can we re-run from this expression plate?
  frequency: weekly
  cost_if_wrong: medium
  cost_reason: Re-runs depend on expression plate life
  depth: core
  sim_hook: |
    Actor robot, action run_worklist(expression to sample plates).
  source: workflow

- id: XFER-BIND-13
  cluster: disposal_with_contents
  duplicate_of: LIFE-004
  title: BLI or SPR run
  story: |
    Given a target plate and sample plates.
    When the instrument runs.
    Then data is produced for each sample well against the target wells, and both plates are thrown away with liquid still in them.
  real_life_noise:
    - run fails halfway and plates are thrown away anyway
    - data file has no plate barcodes
  system_should: |
    In: target plate, sample plates. Out: data linked to wells and lots. Thrown away: both plates.
  question_it_answers: Which target lot and which protein lot made this binding curve?
  frequency: weekly
  cost_if_wrong: high
  cost_reason: This is the result the customer pays for
  depth: core
  sim_hook: |
    Actor instrument, action bli_run. Error run_fail p≈0.03.
  source: workflow

- id: XFER-BIND-14
  cluster: planning_numbers
  duplicate_of: ASK-005
  title: Data processing and review
  story: |
    Given the BLI data.
    When it is processed and reviewed.
    Then no material moves, but results that fail QC lead to a re-run request that needs to know what material is left.
  real_life_noise:
    - re-run asked after the expression plate has expired
    - expression plate still exists but the wells needed have under 5 µL left
    - target stock looks like 40 µL, but two aliquots were used without being recorded
  system_should: |
    No material moves. The inventory must answer "can we re-run this sample" from what's left and usable.
  question_it_answers: Can we re-run these samples without new DNA or target?
  frequency: weekly
  cost_if_wrong: high
  cost_reason: Wrong answer means a delay or needless reorder
  depth: core
  sim_hook: |
    Actor reviewer, action request_rerun p≈0.1 per sample.
  source: workflow
# ---- LOC ------------------------------------------------------------
- id: LOC-001
  cluster: places_and_moves
  duplicate_of: null
  noise_ref: wrong_position_selected
  title: Scientist moves a tube from one freezer box to another and scans both ends
  story: |
    Given tube T-1001 (Target X, lot L1) sits in freezer F1 (-80), rack R3, box B12, slot C4.
    When a scientist takes it out, puts it in box B07 slot A1 in freezer F2 and scans the tube, then the new box and slot.
    Then the system says T-1001 is in F2 / B07 / A1, slot C4 in B12 is free, and the history shows both places with who and when.
  real_life_noise:
    - scans the tube and the box but types the slot as "A01" instead of "A1"
    - scans the box first and the tube second, so the order of events is backwards
    - drops the tube in A1 but A1 is already taken in the system by a tube that was thrown away last month and never marked
    - scans at the freezer with gloves on and the scan registers twice
  system_should: |
    Record the move as a new event, never overwrite the old place. Accept slot names in a few common spellings and store one form. If the target slot is shown as taken, do not silently put two tubes in one slot. Ask, or record both and raise a conflict.
  question_it_answers: Where is T-1001 right now, and where was it before?
  frequency: many-per-day
  cost_if_wrong: medium
  cost_reason: A wrong slot means ten minutes of searching with the freezer door open
  depth: core
  sim_hook: |
    Actor scientist, action move_tube, error slot_typo p≈0.02, double_scan p≈0.01, target_slot_occupied_stale p≈0.01
  source: brief

- id: LOC-002
  cluster: places_and_moves
  duplicate_of: null
  noise_ref: step_not_recorded
  title: A whole box moves, and everything in it moves with it
  story: |
    Given box B12 holds 64 tubes in freezer F1, rack R3, shelf 2.
    When a technician moves the box to freezer F2, rack R1, shelf 4 and scans only the box barcode.
    Then all 64 tubes report freezer F2 as their place, without 64 separate move records being typed in, and their slots inside the box stay the same.
  real_life_noise:
    - two tubes were taken out of the box an hour earlier and are on the bench, but nobody scanned them out, so they "move" to F2 on paper
    - the box label is on the lid, and the lid was swapped with another box's lid
    - the box is put in the right freezer but on a different shelf than scanned
  system_should: |
    Store each tube's place as "inside box B12" and the box's place as "F2 / R1 / shelf 4", so one scan moves everything. Asking "where is tube X" walks up the nesting. Keep the box move as one event so the history is readable.
  question_it_answers: Where is every tube that was in box B12?
  frequency: daily
  cost_if_wrong: medium
  cost_reason: If tubes are stored with flat freezer locations, one box move leaves 64 stale records
  depth: core
  sim_hook: |
    Actor technician, action move_box, error untracked_tube_removed_before_move p≈0.05 per box move, lid_swap p≈0.005
  source: brief

- id: LOC-003
  cluster: places_and_moves
  duplicate_of: null
  noise_ref: step_not_recorded
  title: A plate goes freezer, bench, instrument, back to freezer in one day
  story: |
    Given reconstituted DNA plate P-220 in freezer F3 (-20).
    When at 09:10 it is taken to the bench to thaw, at 09:40 it goes onto the liquid handler deck, at 11:00 it comes off, and at 11:15 it goes back into F3 on a different shelf.
    Then the system shows four moves in order, the plate's current place is F3 shelf 1, and the total time out of the freezer is about two hours.
  real_life_noise:
    - only the first and last moves get scanned; the bench and robot steps are missing
    - the "back to freezer" scan happens at 16:00 when the scientist remembers, though the plate went back at 11:15
    - the plate sits on the bench over lunch and nobody knows how long it was out
  system_should: |
    Accept moves with a "when it happened" time separate from "when it was recorded". Treat the robot run itself as evidence the plate was on the deck, even without a scan. Time out of the freezer is computed from moves, and is marked uncertain when steps are missing.
  question_it_answers: Where is P-220, and how long has it spent outside the cold?
  frequency: many-per-day
  cost_if_wrong: medium
  cost_reason: Wrong time-out-of-freezer hides thaw damage; wrong place costs search time
  depth: core
  sim_hook: |
    Actor scientist, action plate_round_trip, error skip_intermediate_scan p≈0.4 per intermediate step, late_return_scan delay 0-6 h with p≈0.15
  source: workflow

- id: LOC-004
  cluster: places_and_moves
  duplicate_of: null
  noise_ref: barcode_no_read_2d_rack
  title: Whole 96-tube rack read at once by a rack scanner
  story: |
    Given a 96-position rack of 2D-barcoded tubes (Datamatrix code on the bottom of each tube) holding target aliquots.
    When a scientist puts the rack on a flatbed rack scanner and it reads all 96 positions in one go.
    Then the system gets 96 (tube barcode, position) pairs plus the rack barcode, and updates every tube's place in one event.
  real_life_noise:
    - 3 positions come back "no read" because of frost on the tube bottoms
    - the rack is put on the scanner rotated 180 degrees, so A1 reads as H12
    - one position reads "no tube" though there is a tube in it, because it sits too high
    - the scanner software exports a CSV that is saved and uploaded twice
  system_should: |
    Take the rack scan as one batch. Store no-reads as "unknown in position X", not as empty. Notice when the pattern of barcodes matches the known layout rotated 180 degrees and offer to flip it. Ignore an identical re-upload of the same scan file.
  question_it_answers: What is in this rack, slot by slot?
  frequency: daily
  cost_if_wrong: high
  cost_reason: A rotated rack swaps 96 tube places at once and nobody notices until the wrong target is used
  depth: core
  sim_hook: |
    Actor scientist, action rack_scan, error no_read p≈0.03 per position on frozen racks (0.005 when thawed), rotated_rack p≈0.01 per scan, duplicate_upload p≈0.02
  source: research

- id: LOC-005
  cluster: barcode_is_not_container
  duplicate_of: null
  noise_ref: barcode_no_read_1d_label
  title: Frosted -80 tube will not scan
  story: |
    Given tube T-2044 has just come out of the -80 and its barcode label is covered in frost.
    When a scientist tries the handheld scanner four times, gives up and types the barcode by hand from the printed digits.
    Then the system accepts the typed barcode, records that it was typed and not scanned, and the rest of the task goes on.
  real_life_noise:
    - types one digit wrong and it matches a different, real tube
    - wipes the label with a glove and the printed digits smear
    - grabs the tube next to it, which scans fine, and uses that instead without recording it
  system_should: |
    Mark every record with how the barcode got in (scan, rack scan, typed, picked from list). Check typed barcodes with a check digit or against what is expected in that box. Typed entries that hit a tube in a different freezer should warn before going ahead.
  question_it_answers: How sure are we that this event was about the right tube?
  frequency: daily
  cost_if_wrong: high
  cost_reason: A typo that matches a real tube silently moves or consumes the wrong material
  depth: core
  sim_hook: |
    Actor scientist, action scan_frozen_tube, error scan_fail p≈0.15 for -80 tubes, then manual_entry with typo p≈0.02 per typed barcode
  source: research

- id: LOC-006
  cluster: barcode_is_not_container
  duplicate_of: null
  title: Two containers carry the same barcode
  story: |
    Given tube T-3100 already exists, holding Buffer A.
    When a new tube of Target Y is registered and its pre-printed label also reads T-3100 (a reprint from the same label roll).
    Then the system refuses the second registration, or registers it on hold with a clear duplicate flag, and asks for a new label.
  real_life_noise:
    - the duplicate is only noticed weeks later, when a scan of T-3100 "moves" the buffer tube to a box that holds targets
    - label printer was reset and started counting from 3000 again
    - supplier pre-barcoded tubes from two different suppliers happen to share a number
  system_should: |
    Barcodes are unique among containers that are still in the lab. When a scan hits a barcode whose recorded place, material or size does not fit the context, warn. Keep a way to give a container a new barcode while keeping its history.
  question_it_answers: Which container does this barcode really mean?
  frequency: rare
  cost_if_wrong: high
  cost_reason: Every later event lands on the wrong container and mixes two histories
  depth: core
